# Publishes the app to Expo (EAS Update) so it opens in Expo Go on iOS and Android.
# Runs on every push to main that touches app/, or manually from the Actions tab.
# Needs: repository secret EXPO_TOKEN, repository variable API_URL (the Railway URL).
name: App preview (Expo Go)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-preview.yml']
  workflow_dispatch:

concurrency:
  group: app-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check settings
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the EXPO_TOKEN repository secret (Settings → Secrets and variables → Actions)."; exit 1; fi
          if [ -z "$API_URL" ]; then echo "::error::Add the API_URL repository variable with your Railway URL, e.g. https://xxx.up.railway.app"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Creates the Expo project on first run (owned by the token's account), then reuses it.
      - name: Link Expo project
        run: eas init --non-interactive --force

      # Expo Go only loads updates whose runtime version is the SDK version.
      - name: Configure updates for Expo Go
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const id = a.expo.extra.eas.projectId;
            a.expo.runtimeVersion = { policy: "sdkVersion" };
            a.expo.updates = { ...(a.expo.updates || {}), url: `https://u.expo.dev/${id}` };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("EAS project:", id);
          '

      - name: Publish update
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: eas update --branch main --platform all --message "$(printf '%s' "$MESSAGE" | head -n 1 | cut -c1-200)" --non-interactive --json > "$RUNNER_TEMP/update.json"

      - name: Summary
        run: |
          OWNER=$(eas whoami 2>/dev/null | head -n 1)
          node -e '
            const fs = require("fs");
            const [owner, file, api] = process.argv.slice(1);
            const ups = JSON.parse(fs.readFileSync(file, "utf8"));
            const a = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
            const group = ups[0].group;
            const page = `https://expo.dev/accounts/${owner}/projects/${a.slug}/updates/${group}`;
            const lines = [
              "## App published to Expo Go",
              "",
              `**Open on your phone:** ${page} (tap *Preview* / scan the QR code with the camera), or open Expo Go signed in as **${owner}** → Projects → **${a.slug}** → branch **main**.`,
              "",
              `- API: ${api}`,
              `- Runtime: ${ups[0].runtimeVersion}`,
              ...ups.map((u) => `- ${u.platform}: update ${u.id}`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          ' "$OWNER" "$RUNNER_TEMP/update.json" "${{ vars.API_URL }}"
